document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

er-top-color: #fff;\r\n\t}\r\n.leaflet-tooltip-bottom:before {\r\n\ttop: 0;\r\n\tmargin-top: -12px;\r\n\tmargin-left: -6px;\r\n\tborder-bottom-color: #fff;\r\n\t}\r\n.leaflet-tooltip-left {\r\n\tmargin-left: -6px;\r\n}\r\n.leaflet-tooltip-right {\r\n\tmargin-left: 6px;\r\n}\r\n.leaflet-tooltip-left:before,\r\n.leaflet-tooltip-right:before {\r\n\ttop: 50%;\r\n\tmargin-top: -6px;\r\n\t}\r\n.leaflet-tooltip-left:before {\r\n\tright: 0;\r\n\tmargin-right: -12px;\r\n\tborder-left-color: #fff;\r\n\t}\r\n.leaflet-tooltip-right:before {\r\n\tleft: 0;\r\n\tmargin-left: -12px;\r\n\tborder-right-color: #fff;\r\n\t}\r\n\r\n/* Printing */\r\n\r\n@media print {\r\n\t/* Prevent printers from removing background-images of controls. */\r\n\t.leaflet-control {\r\n\t\t-webkit-print-color-adjust: exact;\r\n\t\tprint-color-adjust: exact;\r\n\t\t}\r\n\t}\r\n<\u002Fstyle>\n<script src=\"040a61c1-a24a-42b1-9384-c2167dfcc92a\" integrity=\"sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"b1964615-e72d-4626-8d35-cb8a3f954b0f\"><\u002Fscript>\n<style>\n  body { margin:0; background:#17120e; color:#f0e8e0; font-family: ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif; -webkit-font-smoothing: antialiased; }\n  a { color:#e2703a; text-decoration:none; }\n  a:hover { color:#f08a58; }\n  ::placeholder { color:#6d5c4e; }\n  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }\n  sg-map { display:block; height:480px; }\n  sg-map .leaflet-tile-pane { filter: grayscale(.5) sepia(.28) brightness(.96) contrast(.98); }\n  sg-map .leaflet-container { background:#e8dfd2; font:inherit; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh; background:#17120e; color:#f0e8e0; padding:20px 24px 40px; font-size:15px; line-height:1.5\">\n  <header style=\"display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding-bottom:14px; border-bottom:1px solid #362b23; margin-bottom:20px\">\n    <div style=\"display:flex; align-items:baseline; gap:12px\">\n      <h1 style=\"margin:0; font-size:1.0625rem; font-weight:600; letter-spacing:.01em\">NL Tasking → Structured Mission Command<\u002Fh1>\n      <span style=\"font-size:.75rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:#a49383\">C2 bridge · AO Singapore<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:10px; font-size:.75rem; color:#a49383\">\n      <span style=\"border:1px solid #362b23; border-radius:999px; padding:3px 10px\">schema v1 · 5 fields<\u002Fspan>\n      <span style=\"border:1px solid #362b23; border-radius:999px; padding:3px 10px\">few-shot k=3<\u002Fspan>\n      <span style=\"border:1px solid #362b23; border-radius:999px; padding:3px 10px\">repair retries 1<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"display:grid; grid-template-columns: minmax(280px,330px) minmax(440px,1fr) minmax(280px,340px); gap:16px; align-items:start\">\n\n    <section style=\"display:flex; flex-direction:column; gap:12px\">\n      <p style=\"margin:0; font-size:.75rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:#a49383\">Operator tasking<\u002Fp>\n      <div style=\"border:1px solid #362b23; border-radius:1rem; background:#221a15; padding:1rem; display:flex; flex-direction:column; gap:12px\">\n        <textarea value=\"{{ input }}\" sc-camel-on-change=\"{{ onInput }}\" rows=\"3\" placeholder=\"Launch 4 drones from Alpha, survey Sector 7, land at nearest LZ with clear approach.\" style=\"width:100%; resize:vertical; background:#17120e; color:#f0e8e0; border:1px solid #362b23; border-radius:.75rem; padding:.75rem; font:inherit; font-size:.9375rem; line-height:1.45; outline:none\" style-focus=\"border-color:#e2703a\"><\u002Ftextarea>\n        <div style=\"display:flex; align-items:center; gap:10px\">\n          <button sc-camel-on-click=\"{{ onRun }}\" disabled=\"{{ busy }}\" style=\"flex:1; background:#e2703a; color:#17120e; border:none; border-radius:.75rem; padding:.7rem 1rem; font:inherit; font-weight:600; font-size:.9375rem; cursor:pointer; min-height:44px\" style-hover=\"background:#f08a58\">{{ runLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onClear }}\" style=\"background:transparent; color:#a49383; border:1px solid #362b23; border-radius:.75rem; padding:.7rem .9rem; font:inherit; font-size:.875rem; cursor:pointer; min-height:44px\" style-hover=\"color:#f0e8e0; border-color:#4a3b31\">Clear<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"margin:6px 0 0; font-size:.75rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:#a49383\">Swarm configuration<\u002Fp>\n      <div style=\"border:1px solid #362b23; border-radius:1rem; background:#221a15; padding:1rem; display:flex; flex-direction:column; gap:14px\">\n        <div style=\"display:flex; flex-direction:column; gap:6px\">\n          <span style=\"font-size:.75rem; color:#a49383\">Drone type<\u002Fspan>\n          <div style=\"display:flex; gap:6px\">\n            <sc-for list=\"{{ typeOpts }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ t.pick }}\" style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; background: {{ t.bg }}; color: {{ t.fg }}; border:1px solid {{ t.line }}; border-radius:.75rem; padding:.5rem .3rem; font:inherit; font-size:.75rem; font-weight:600; cursor:pointer; min-height:44px\">\n                <span style=\"width:8px; height:8px; border-radius:999px; background: {{ t.dot }}\"><\u002Fspan>{{ t.label }}\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:6px\">\n          <span style=\"font-size:.75rem; color:#a49383\">Count — {{ countNote }}<\u002Fspan>\n          <div style=\"display:flex; align-items:center; gap:10px\">\n            <input type=\"range\" min=\"1\" max=\"12\" value=\"{{ count }}\" sc-camel-on-change=\"{{ onCount }}\" style=\"flex:1; accent-color:#e2703a\">\n            <span style=\"font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:1rem; font-weight:600; width:2ch; text-align:right\">{{ count }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:6px\">\n          <span style=\"font-size:.75rem; color:#a49383\">Formation<\u002Fspan>\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:6px\">\n            <sc-for list=\"{{ formOpts }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ f.pick }}\" style=\"display:flex; align-items:center; gap:8px; background: {{ f.bg }}; color: {{ f.fg }}; border:1px solid {{ f.line }}; border-radius:.75rem; padding:.5rem .7rem; font:inherit; font-size:.8125rem; font-weight:600; cursor:pointer; min-height:44px\">\n                <span style=\"font-family:ui-monospace, Menlo, monospace; font-size:.8125rem; letter-spacing:-1px\">{{ f.glyph }}<\u002Fspan>{{ f.label }}\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onManualDeploy }}\" disabled=\"{{ deploying }}\" style=\"background:transparent; color:#e2703a; border:1px solid #6b3a20; border-radius:.75rem; padding:.65rem 1rem; font:inherit; font-weight:600; font-size:.875rem; cursor:pointer; min-height:44px\" style-hover=\"background:#2a1e16\">{{ manualLabel }}<\u002Fbutton>\n        <p style=\"margin:0; font-size:.75rem; color:#a49383\">Manual deploy bypasses the NL pipeline and launches with these settings to {{ manualTarget }}.<\u002Fp>\n      <\u002Fdiv>\n\n      <p style=\"margin:6px 0 0; font-size:.75rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:#a49383\">Test taskings<\u002Fp>\n      <div style=\"display:flex; flex-direction:column; gap:8px\">\n        <sc-for list=\"{{ samples }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ s.pick }}\" style=\"text-align:left; background:#221a15; color:#f0e8e0; border:1px solid #362b23; border-radius:.75rem; padding:.7rem .8rem; font:inherit; font-size:.8125rem; cursor:pointer; display:flex; gap:.6rem; align-items:flex-start\" style-hover=\"border-color:#4a3b31\">\n            <span style=\"color:#a49383; font-variant-numeric:tabular-nums\">{{ s.n }}<\u002Fspan>\n            <span style=\"flex:1\">{{ s.text }}<span style=\"display:block; color:#a49383; margin-top:3px\">{{ s.expect }}<\u002Fspan><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex; flex-direction:column; gap:12px; min-width:0\">\n      <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:.75rem\">\n        <p style=\"margin:0; font-size:.75rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:#a49383\">Area of operations — Singapore<\u002Fp>\n        <span style=\"font-size:.75rem; color:#a49383\">◆ base · ◌ landing zone · S1–S9 sectors<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:relative; border:1px solid #362b23; border-radius:1rem; overflow:hidden; background:#221a15\">\n        <x-import component-from-global-scope=\"sg-map\" hint-size=\"100%,480px\" style=\"display:block; height:480px\"><\u002Fx-import>\n        <sc-if value=\"{{ missionLabel }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute; left:12px; bottom:12px; z-index:800; display:flex; align-items:center; gap:.5rem; background:#221a15ee; border:1px solid #362b23; border-radius:999px; padding:.4rem .9rem; font-size:.8125rem\">\n            <span style=\"width:8px; height:8px; border-radius:999px; flex:none; background: {{ missionColor }}; animation: {{ missionAnim }}\"><\u002Fspan>\n            <span style=\"font-family:ui-monospace, SFMono-Regular, Menlo, monospace; white-space:nowrap\">{{ missionLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasVerdict }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border:1px solid {{ verdictLine }}; border-radius:1rem; background:#221a15; overflow:hidden\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:.75rem; padding:.8rem 1rem; border-bottom:1px solid #362b23; background: {{ verdictWash }}\">\n            <span style=\"font-size:.875rem; font-weight:600; color: {{ verdictLine }}\">{{ verdictTitle }}<\u002Fspan>\n            <span style=\"font-size:.75rem; color:#a49383\">{{ verdictMeta }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ verdictNote }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0; padding:.8rem 1rem; font-size:.8125rem; color:#f0e8e0; border-bottom:1px solid #362b23\">{{ verdictNote }}<\u002Fp>\n          <\u002Fsc-if>\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:0 1.5rem; padding:.2rem .8rem\">\n            <sc-for list=\"{{ fields }}\" as=\"f\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:.75rem; padding:.5rem .2rem; border-bottom:1px solid #2b221b\">\n                <code style=\"font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.75rem; color:#a49383\">{{ f.key }}<\u002Fcode>\n                <span style=\"text-align:right; font-size:.8125rem; font-weight:500; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; color: {{ f.color }}\">{{ f.value }}<span style=\"display:block; font-family:inherit; font-weight:400; font-size:.7rem; color:#a49383\">{{ f.note }}<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ canDispatch }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; gap:.6rem; padding:.8rem 1rem; border-top:1px solid #362b23\">\n              <button sc-camel-on-click=\"{{ onDispatch }}\" style=\"flex:1; background:#e2703a; color:#17120e; border:none; border-radius:.75rem; padding:.65rem 1rem; font:inherit; font-weight:600; font-size:.875rem; cursor:pointer; min-height:44px\" style-hover=\"background:#f08a58\">Dispatch — deploy swarm<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ mustReview }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; gap:.6rem; padding:.8rem 1rem; border-top:1px solid #362b23\">\n              <button sc-camel-on-click=\"{{ onFlag }}\" style=\"flex:1; background:transparent; color:#e5695c; border:1px solid #5c342f; border-radius:.75rem; padding:.65rem 1rem; font:inherit; font-weight:600; font-size:.875rem; cursor:pointer; min-height:44px\" style-hover=\"background:#2c1e1a\">Route to human review<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section style=\"display:flex; flex-direction:column; gap:12px\">\n      <p style=\"margin:0; font-size:.75rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:#a49383\">Pipeline trace<\u002Fp>\n      <div style=\"border:1px solid #362b23; border-radius:1rem; background:#221a15; padding:1rem; display:flex; flex-direction:column; gap:.85rem\">\n        <sc-for list=\"{{ stages }}\" as=\"st\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex; gap:.7rem; align-items:flex-start\">\n            <span style=\"width:9px; height:9px; border-radius:999px; margin-top:.45rem; flex:none; background: {{ st.color }}; animation: {{ st.anim }}\"><\u002Fspan>\n            <div style=\"flex:1\">\n              <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:.75rem\">\n                <span style=\"font-size:.875rem; font-weight:500\">{{ st.name }}<\u002Fspan>\n                <span style=\"font-size:.75rem; color: {{ st.color }}; text-transform:uppercase; letter-spacing:.04em\">{{ st.label }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ st.detail }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"margin:.15rem 0 0; font-size:.8125rem; color:#a49383\">{{ st.detail }}<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:.75rem; margin-top:6px\">\n        <p style=\"margin:0; font-size:.75rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:#a49383\">Command log<\u002Fp>\n        <span style=\"font-size:.75rem; color:#a49383\">{{ logMeta }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:10px\">\n        <sc-if value=\"{{ logEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"border:1px solid #362b23; border-radius:1rem; background:#221a15; padding:1rem\">\n            <p style=\"margin:0; font-size:.875rem; color:#a49383\">No taskings processed yet. Parse a tasking or deploy manually to see commands routed here.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ log }}\" as=\"e\" hint-placeholder-count=\"0\">\n          <article style=\"border:1px solid #362b23; border-radius:1rem; background:#221a15; padding:.9rem 1rem\">\n            <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:.75rem; margin-bottom:.4rem\">\n              <span style=\"font-size:.75rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color: {{ e.color }}\">{{ e.status }}<\u002Fspan>\n              <span style=\"font-size:.75rem; color:#a49383; font-variant-numeric:tabular-nums\">{{ e.time }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 .5rem; font-size:.875rem; color:#f0e8e0\">{{ e.input }}<\u002Fp>\n            <pre style=\"margin:0; padding:.6rem; background:#17120e; border:1px solid #362b23; border-radius:.6rem; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.75rem; color:#a49383; white-space:pre-wrap; word-break:break-word\">{{ e.body }}<\u002Fpre>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst TASK_TYPES = [\"survey\", \"patrol\", \"recon\", \"escort\", \"resupply\"];\nconst LANDING = [\"nearest_clear_approach\", \"any_available\", \"return_to_origin\"];\n\nconst SCHEMA_PROMPT = `{\n  \"drone_count\": integer >= 1,\n  \"origin\": string | null,\n  \"task_type\": one of ${JSON.stringify(TASK_TYPES)},\n  \"target_sector\": string,\n  \"landing_constraint\": one of ${JSON.stringify(LANDING)},\n  \"confidence\": \"high\" | \"low\",\n  \"ambiguous_fields\": array of field names left ambiguous by the source text\n}`;\n\nconst FEWSHOT = `Example 1\nTasking: \"Launch 4 drones from Alpha, survey Sector 7, land at nearest LZ with clear approach.\"\nJSON: {\"drone_count\":4,\"origin\":\"Alpha\",\"task_type\":\"survey\",\"target_sector\":\"Sector 7\",\"landing_constraint\":\"nearest_clear_approach\",\"confidence\":\"high\",\"ambiguous_fields\":[]}\n\nExample 2\nTasking: \"Send 2 drones to patrol the north perimeter.\"\nJSON: {\"drone_count\":2,\"origin\":null,\"task_type\":\"patrol\",\"target_sector\":\"north_perimeter\",\"landing_constraint\":\"any_available\",\"confidence\":\"high\",\"ambiguous_fields\":[]}\n\nExample 3\nTasking: \"Get a few drones over to Sector 9 for recon.\"\nJSON: {\"drone_count\":null,\"origin\":null,\"task_type\":\"recon\",\"target_sector\":\"Sector 9\",\"landing_constraint\":\"any_available\",\"confidence\":\"low\",\"ambiguous_fields\":[\"drone_count\"]}`;\n\nconst SYSTEM = `You are a C2 tasking parser. Convert one English drone-swarm tasking into a single structured mission command JSON object.\n\nSchema:\n${SCHEMA_PROMPT}\n\nRules:\n- Return ONLY the JSON object. No prose, no code fences.\n- Never invent a value the source text does not support. If a field is stated vaguely (\"a few\", \"some\", \"several\", \"a couple\"), set it to null, list its name in ambiguous_fields, and set confidence to \"low\".\n- origin is null when no launch point is stated. landing_constraint defaults to \"any_available\" when unstated — that default is not ambiguity.\n- target_sector keeps the operator's label (\"Sector 7\") or a snake_case form of a described area (\"north_perimeter\").\n\n${FEWSHOT}`;\n\nconst SAMPLES = [\n  { n: \"1\", text: \"Launch 4 drones from Alpha, survey Sector 7, land at nearest LZ with clear approach.\", expect: \"Expect: all five fields populated\" },\n  { n: \"2\", text: \"Send 2 drones to patrol the north perimeter.\", expect: \"Expect: origin null, landing default applied\" },\n  { n: \"3\", text: \"Get a few drones over to Sector 9 for recon.\", expect: \"Expect: flagged — ambiguous drone count\" }\n];\n\nconst C = { ok: \"#7fae6a\", run: \"#e2703a\", fail: \"#e5695c\", idle: \"#6d5c4e\", muted: \"#a49383\", fg: \"#f0e8e0\" };\nconst STAGE_NAMES = [\"Prompt assembly\", \"Structured generation\", \"Schema validation\", \"Repair re-prompt\", \"Routing\"];\n\nconst TYPES = [\n  { id: \"recon\", label: \"Recon-Q\", dot: \"#e2703a\" },\n  { id: \"strike\", label: \"Strike-FPV\", dot: \"#e5695c\" },\n  { id: \"cargo\", label: \"Cargo-VTOL\", dot: \"#7fae6a\" }\n];\nconst FORMS = [\n  { id: \"wedge\", label: \"Wedge\", glyph: \"∧\" },\n  { id: \"line\", label: \"Line\", glyph: \"———\" },\n  { id: \"ring\", label: \"Ring\", glyph: \"◯\" },\n  { id: \"column\", label: \"Column\", glyph: \"⋮\" }\n];\n\n// --- Singapore geography ---\nconst BASES = { Alpha: { lat: 1.387, lng: 103.708 }, Bravo: { lat: 1.358, lng: 103.909 } };\nconst LZS = [\n  { tag: \"LZ-1 Kranji\", lat: 1.425, lng: 103.755, clear: true, note: \"clear approach\" },\n  { tag: \"LZ-2 Marina\", lat: 1.28, lng: 103.871, clear: false, note: \"obstructed\" },\n  { tag: \"LZ-3 Changi\", lat: 1.345, lng: 104.005, clear: true, note: \"clear approach\" },\n  { tag: \"LZ-4 Sentosa\", lat: 1.249, lng: 103.83, clear: true, note: \"clear approach\" }\n];\nconst GRID = { lat0: 1.235, lat1: 1.455, lng0: 103.62, lng1: 104.04 };\nconst SECTORS = [];\nfor (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {\n  const dLat = (GRID.lat1 - GRID.lat0) / 3, dLng = (GRID.lng1 - GRID.lng0) / 3;\n  SECTORS.push({ n: r * 3 + c + 1, lat1: GRID.lat1 - r * dLat, lat0: GRID.lat1 - (r + 1) * dLat, lng0: GRID.lng0 + c * dLng, lng1: GRID.lng0 + (c + 1) * dLng });\n}\nconst PERIMETER = [[1.448, 103.65], [1.44, 103.72], [1.452, 103.78], [1.44, 103.85], [1.428, 103.92], [1.42, 103.99]];\n\nfunction resolveTarget(name) {\n  const s = String(name || \"\");\n  const m = /(\\d)/.exec(s);\n  if (/sector/i.test(s) && m) {\n    const sec = SECTORS[parseInt(m[1], 10) - 1];\n    if (sec) return { lat: (sec.lat0 + sec.lat1) / 2, lng: (sec.lng0 + sec.lng1) / 2, label: \"SECTOR \" + m[1] };\n  }\n  if (/north|perimeter/i.test(s)) return { lat: 1.443, lng: 103.8, label: \"NORTH PERIMETER\" };\n  return { lat: 1.345, lng: 103.83, label: s ? s.toUpperCase() : \"SECTOR 5\" };\n}\nfunction offsetOf(form, i, n, m) {\n  if (form === \"line\") return { x: (i - (n - 1) / 2) * m, y: 0 };\n  if (form === \"ring\") { const a = (2 * Math.PI * i) / n; return { x: Math.cos(a) * m * 1.4, y: Math.sin(a) * m * 1.4 }; }\n  if (form === \"column\") return { x: 0, y: -i * m };\n  const k = Math.ceil(i / 2), side = i % 2 ? -1 : 1; // wedge\n  return { x: (i === 0 ? 0 : side * k * m), y: -k * m };\n}\nconst ease = x => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);\nconst lerp = (a, b, t) => a + (b - a) * t;\n\nclass Component extends DCLogic {\n  state = {\n    input: \"\", busy: false,\n    stages: STAGE_NAMES.map(n => ({ n, s: \"idle\", d: \"\" })),\n    result: null, raw: \"\", errors: [], ambiguous: [], routed: false, log: [],\n    droneType: \"recon\", count: 4, formation: \"wedge\",\n    deploying: false, missionLabel: \"\", missionColor: C.run, missionAnim: \"none\"\n  };\n  raf = 0;\n\n  componentDidMount() {\n    const bind = () => {\n      const el = document.querySelector(\"sg-map\");\n      if (el && el.setStatic) { this.mapEl = el; el.setStatic({ bases: Object.entries(BASES).map(([name, p]) => ({ name: \"BASE \" + name.toUpperCase(), ...p })), lzs: LZS, sectors: SECTORS, perimeter: PERIMETER }); }\n      else setTimeout(bind, 150);\n    };\n    bind();\n  }\n  componentWillUnmount() { cancelAnimationFrame(this.raf); }\n\n  setStage(i, s, d) {\n    this.setState(st => ({ stages: st.stages.map((x, k) => (k === i ? { ...x, s, d: d === undefined ? x.d : d } : x)) }));\n  }\n  reset() {\n    this.setState({ stages: STAGE_NAMES.map(n => ({ n, s: \"idle\", d: \"\" })), result: null, raw: \"\", errors: [], ambiguous: [], routed: false });\n  }\n  extractJson(text) {\n    const m = String(text || \"\").match(/\\{[\\s\\S]*\\}/);\n    if (!m) return null;\n    try { return JSON.parse(m[0]); } catch (e) { return null; }\n  }\n  validate(obj) {\n    const errs = [];\n    if (!obj || typeof obj !== \"object\" || Array.isArray(obj)) return [\"output is not a JSON object\"];\n    const amb = Array.isArray(obj.ambiguous_fields) ? obj.ambiguous_fields : [];\n    const dc = obj.drone_count;\n    if (dc === null || dc === undefined) {\n      if (!amb.includes(\"drone_count\")) errs.push(\"drone_count is null but not listed in ambiguous_fields\");\n    } else if (!Number.isInteger(dc) || dc < 1) errs.push(\"drone_count must be an integer >= 1\");\n    if (!(\"origin\" in obj)) errs.push(\"origin missing (use null when unstated)\");\n    else if (obj.origin !== null && typeof obj.origin !== \"string\") errs.push(\"origin must be a string or null\");\n    if (!TASK_TYPES.includes(obj.task_type)) errs.push(\"task_type must be one of \" + TASK_TYPES.join(\", \"));\n    if (typeof obj.target_sector !== \"string\" || !obj.target_sector.trim()) {\n      if (!amb.includes(\"target_sector\")) errs.push(\"target_sector must be a non-empty string\");\n    }\n    if (!LANDING.includes(obj.landing_constraint)) errs.push(\"landing_constraint must be one of \" + LANDING.join(\", \"));\n    if (obj.confidence !== \"high\" && obj.confidence !== \"low\") errs.push('confidence must be \"high\" or \"low\"');\n    return errs;\n  }\n\n  run = async () => {\n    const tasking = this.state.input.trim();\n    if (!tasking || this.state.busy) return;\n    this.reset();\n    this.setState({ busy: true });\n    this.setStage(0, \"run\");\n    await new Promise(r => setTimeout(r, 180));\n    this.setStage(0, \"ok\", \"3 few-shot pairs + 7-key schema\");\n\n    const attempt = async (msgs, stage) => {\n      this.setStage(stage, \"run\", \"\");\n      let text = \"\";\n      try { text = await window.claude.complete({ system: SYSTEM, max_tokens: 700, messages: msgs }); }\n      catch (e) {\n        this.setStage(stage, \"fail\", \"model call failed: \" + (e && e.message ? e.message : \"unknown error\"));\n        return { text: \"\", obj: null };\n      }\n      const obj = this.extractJson(text);\n      this.setState({ raw: String(text || \"\").trim() });\n      this.setStage(stage, obj ? \"ok\" : \"fail\", obj ? \"JSON object returned\" : \"no parseable JSON in output\");\n      return { text, obj };\n    };\n\n    const first = await attempt([{ role: \"user\", content: \"Tasking: \" + JSON.stringify(tasking) }], 1);\n    let obj = first.obj;\n    let errs = obj ? this.validate(obj) : [\"output was not parseable JSON\"];\n    this.setStage(2, errs.length ? \"fail\" : \"ok\", errs.length ? errs.join(\"; \") : \"all fields valid against schema v1\");\n\n    if (errs.length) {\n      const repair = await attempt([\n        { role: \"user\", content: \"Tasking: \" + JSON.stringify(tasking) },\n        { role: \"assistant\", content: String(first.text || \"(no output)\") },\n        { role: \"user\", content: \"That output failed schema validation:\\n- \" + errs.join(\"\\n- \") + \"\\nReturn a corrected JSON object only.\" }\n      ], 3);\n      obj = repair.obj;\n      errs = obj ? this.validate(obj) : [\"repair output was not parseable JSON\"];\n      this.setStage(2, errs.length ? \"fail\" : \"ok\", errs.length ? \"after repair: \" + errs.join(\"; \") : \"valid after one repair attempt\");\n    } else {\n      this.setStage(3, \"idle\", \"not needed\");\n    }\n\n    const amb = obj && Array.isArray(obj.ambiguous_fields) ? obj.ambiguous_fields : [];\n    const lowConf = obj && obj.confidence === \"low\";\n    const flagged = errs.length > 0 || amb.length > 0 || lowConf;\n    this.setStage(4, flagged ? \"fail\" : \"ok\", flagged\n      ? (errs.length ? \"schema validation failed twice → human review\" : \"low confidence on \" + (amb.join(\", \") || \"unnamed field\") + \" → human review\")\n      : \"cleared — dispatch to deploy the swarm\");\n    const patch = { result: obj, errors: errs, ambiguous: amb, busy: false };\n    if (!flagged && obj && Number.isInteger(obj.drone_count)) patch.count = Math.min(12, obj.drone_count);\n    this.setState(patch);\n  };\n\n  commandOnly(o) {\n    if (!o) return {};\n    return {\n      drone_count: o.drone_count ?? null,\n      origin: o.origin ?? null,\n      task_type: o.task_type ?? null,\n      target_sector: o.target_sector ?? null,\n      landing_constraint: o.landing_constraint ?? \"any_available\"\n    };\n  }\n\n  pickLZ(constraint, target, originBase) {\n    if (constraint === \"return_to_origin\") return { tag: \"ORIGIN\", ...originBase };\n    const pool = constraint === \"nearest_clear_approach\" ? LZS.filter(z => z.clear) : LZS;\n    return pool.reduce((a, b) =>\n      Math.hypot(a.lat - target.lat, a.lng - target.lng) < Math.hypot(b.lat - target.lat, b.lng - target.lng) ? a : b);\n  }\n\n  deploy(cmd) {\n    if (this.state.deploying || !this.mapEl) return;\n    const st = this.state;\n    const n = Math.min(12, Math.max(1, Number.isInteger(cmd.drone_count) ? cmd.drone_count : st.count));\n    const type = TYPES.find(t => t.id === st.droneType) || TYPES[0];\n    const base = BASES[/bravo/i.test(cmd.origin || \"\") ? \"Bravo\" : \"Alpha\"];\n    const target = resolveTarget(cmd.target_sector);\n    const lz = this.pickLZ(cmd.landing_constraint, target, base);\n    const M = 0.0016; // formation spacing in degrees (~180 m)\n    const T = { launch: 1.5, transit: 6.5, station: 10.5, land: 14, end: 15 };\n    const desc = n + \" × \" + type.label + \" · \" + st.formation + \" → \" + target.label;\n    this.mapEl.setMission({ target: [target.lat, target.lng], label: target.label, path: [[base.lat, base.lng], [target.lat, target.lng], [lz.lat, lz.lng]], lz: [lz.lat, lz.lng] });\n    this.setState({ deploying: true, missionLabel: desc + \" — launching\", missionColor: C.run, missionAnim: \"pulse 1s ease-in-out infinite\" });\n    const t0 = performance.now();\n    let lastPhase = \"launching\";\n    const tick = () => {\n      const t = (performance.now() - t0) / 1000;\n      let cx, cy, scale = 1, phase;\n      if (t < T.launch) { phase = \"launching\"; cx = base.lat; cy = base.lng; scale = 0.3 + 0.2 * (t / T.launch); }\n      else if (t < T.transit) { phase = \"en route\"; const p = ease((t - T.launch) / (T.transit - T.launch)); cx = lerp(base.lat, target.lat, p); cy = lerp(base.lng, target.lng, p); scale = Math.min(1, 0.5 + (t - T.launch)); }\n      else if (t < T.station) { phase = \"on station — \" + (cmd.task_type || \"survey\"); cx = target.lat; cy = target.lng; }\n      else if (t < T.land) { phase = \"landing at \" + lz.tag; const p = ease((t - T.station) / (T.land - T.station)); cx = lerp(target.lat, lz.lat, p); cy = lerp(target.lng, lz.lng, p); scale = 1 - 0.85 * p; }\n      else {\n        this.mapEl.setDrones([]);\n        this.mapEl.setMission(null);\n        this.setState({ deploying: false, missionLabel: desc + \" — complete, recovered at \" + lz.tag, missionColor: C.ok, missionAnim: \"none\" });\n        return;\n      }\n      const rot = st.formation === \"ring\" ? (t * 0.5) : 0;\n      const drones = [];\n      for (let i = 0; i < n; i++) {\n        let o = offsetOf(st.formation, i, n, M * scale);\n        if (rot) { const c = Math.cos(rot), s = Math.sin(rot); o = { x: o.x * c - o.y * s, y: o.x * s + o.y * c }; }\n        drones.push({ lat: cx + o.y, lng: cy + o.x, color: type.dot });\n      }\n      this.mapEl.setDrones(drones);\n      if (phase !== lastPhase) { lastPhase = phase; this.setState({ missionLabel: desc + \" — \" + phase }); }\n      this.raf = requestAnimationFrame(tick);\n    };\n    this.raf = requestAnimationFrame(tick);\n  }\n\n  route(status, cmd, note) {\n    const body = status === \"Flagged\"\n      ? (this.state.errors.length ? \"validation: \" + this.state.errors.join(\"; \") : \"ambiguous: \" + (this.state.ambiguous.join(\", \") || \"unspecified\") + \" — not guessed\")\n      : JSON.stringify({ ...cmd, swarm: { type: this.state.droneType, formation: this.state.formation } }, null, 2);\n    const time = new Date().toLocaleTimeString([], { hour: \"2-digit\", minute: \"2-digit\", second: \"2-digit\" });\n    this.setState(st => ({\n      routed: status !== \"Manual\",\n      log: [{ id: Date.now(), status, time, input: note, body, color: status === \"Flagged\" ? C.fail : C.ok }, ...st.log]\n    }));\n  }\n\n  renderVals() {\n    const st = this.state;\n    const flagged = !!st.result && (st.errors.length > 0 || st.ambiguous.length > 0 || st.result.confidence === \"low\");\n    const hasVerdict = !!st.result;\n    const attempts = st.stages[3].s === \"idle\" ? 1 : 2;\n    const amb = st.ambiguous;\n    const cmd = this.commandOnly(st.result);\n    const lastTarget = st.result && !flagged && st.result.target_sector ? st.result.target_sector : \"Sector 5\";\n    const selBtn = on => ({ bg: on ? \"#e2703a\" : \"transparent\", fg: on ? \"#17120e\" : \"#a49383\", line: on ? \"#e2703a\" : \"#362b23\" });\n    return {\n      input: st.input, busy: st.busy,\n      runLabel: st.busy ? \"Parsing…\" : \"Parse tasking\",\n      onInput: e => this.setState({ input: e.target.value }),\n      onRun: this.run,\n      onClear: () => { this.setState({ input: \"\" }); this.reset(); },\n      samples: SAMPLES.map(s => ({ ...s, pick: () => { this.setState({ input: s.text }); this.reset(); } })),\n      typeOpts: TYPES.map(t => ({ label: t.label, dot: t.dot, ...selBtn(st.droneType === t.id), fg: st.droneType === t.id ? \"#17120e\" : \"#f0e8e0\", pick: () => this.setState({ droneType: t.id }) })),\n      formOpts: FORMS.map(f => ({ label: f.label, glyph: f.glyph, ...selBtn(st.formation === f.id), fg: st.formation === f.id ? \"#17120e\" : \"#f0e8e0\", pick: () => this.setState({ formation: f.id }) })),\n      count: st.count,\n      countNote: st.result && Number.isInteger(cmd.drone_count) ? \"synced from parsed command\" : \"manual\",\n      onCount: e => this.setState({ count: parseInt(e.target.value, 10) || 1 }),\n      deploying: st.deploying,\n      manualLabel: st.deploying ? \"Swarm airborne…\" : \"Deploy swarm manually\",\n      manualTarget: lastTarget,\n      onManualDeploy: () => {\n        const mc = { drone_count: st.count, origin: \"Alpha\", task_type: \"survey\", target_sector: lastTarget, landing_constraint: \"any_available\" };\n        this.route(\"Manual\", mc, \"Manual deployment — \" + st.count + \" × \" + (TYPES.find(t => t.id === st.droneType) || {}).label + \", \" + st.formation);\n        this.deploy(mc);\n      },\n      stages: st.stages.map(x => ({\n        name: x.n, detail: x.d,\n        label: x.s === \"run\" ? \"running\" : x.s === \"ok\" ? \"pass\" : x.s === \"fail\" ? \"fail\" : \"idle\",\n        color: x.s === \"run\" ? C.run : x.s === \"ok\" ? C.ok : x.s === \"fail\" ? C.fail : C.idle,\n        anim: x.s === \"run\" ? \"pulse 1s ease-in-out infinite\" : \"none\"\n      })),\n      hasVerdict,\n      fields: !st.result ? [] : Object.keys(cmd).map(k => {\n        const isDefault = k === \"landing_constraint\" && cmd[k] === \"any_available\" && !/land|lz|return/i.test(st.input);\n        return {\n          key: k,\n          value: cmd[k] === null ? \"null\" : JSON.stringify(cmd[k]),\n          note: amb.includes(k) ? \"ambiguous — not guessed\" : (cmd[k] === null ? (k === \"origin\" ? \"not stated\" : \"missing\") : (isDefault ? \"schema default\" : \"\")),\n          color: amb.includes(k) ? C.fail : (cmd[k] === null ? C.muted : C.fg)\n        };\n      }),\n      verdictTitle: flagged ? \"Flagged for human review\" : \"Valid mission command\",\n      verdictLine: flagged ? C.fail : C.ok,\n      verdictWash: flagged ? \"#2c1e1a\" : \"#1e2419\",\n      verdictMeta: attempts === 2 ? \"2 model calls · 1 repair\" : \"1 model call · no repair\",\n      verdictNote: st.errors.length\n        ? \"Schema validation failed after the repair attempt: \" + st.errors.join(\"; \")\n        : (st.ambiguous.length ? \"Ambiguous in the tasking: \" + st.ambiguous.join(\", \") + \". Held back rather than guessed.\" : \"\"),\n      canDispatch: hasVerdict && !flagged && !st.routed,\n      mustReview: hasVerdict && flagged && !st.routed,\n      onDispatch: () => { this.route(\"Dispatched\", cmd, st.input.trim()); this.deploy(cmd); },\n      onFlag: () => this.route(\"Flagged\", cmd, st.input.trim()),\n      missionLabel: st.missionLabel, missionColor: st.missionColor, missionAnim: st.missionAnim,\n      log: st.log, logEmpty: st.log.length === 0,\n      logMeta: st.log.length ? st.log.filter(e => e.status !== \"Flagged\").length + \" deployed · \" + st.log.filter(e => e.status === \"Flagged\").length + \" flagged\" : \"\"\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
